# Pilot stack with external Postgres (Supabase) — no local db container.
#
# Local:
#   cp deploy/pilot/.env.supabase.example deploy/pilot/.env.supabase
#   docker compose -f docker-compose-pilot-supabase.yml \
#     --env-file deploy/pilot/.env.supabase up -d --build
#   UI: http://localhost:9581  API: http://localhost:9501
#
# Live VM (always-on):
#   docker compose -f docker-compose-pilot-supabase.yml \
#     -f deploy/pilot/docker-compose.live-supabase.yml \
#     --env-file deploy/pilot/.env up -d --build
#
# DATABASE_URL          = runtime (Transaction pooler :6543)
# DATABASE_URL_MIGRATE  = Alembic/seed (Session/direct :5432); defaults to DATABASE_URL

name: fms-pilot-supabase

services:
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DATABASE_URL: ${DATABASE_URL_MIGRATE:-${DATABASE_URL:?set DATABASE_URL}}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      APP_ENV: pilot
      SEED_MODULE: ${SEED_MODULE:-pilot}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_FULL_NAME: ${SUPER_ADMIN_FULL_NAME:-}
      SUPER_ADMIN_TENANT_NAME: ${SUPER_ADMIN_TENANT_NAME:-}
    command: python -m app.docker_migrate
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      APP_ENV: pilot
      CORS_ORIGINS: ${CORS_ORIGINS:-https://demo.orbittech.co}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://demo.orbittech.co}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-pilot@fms.local}
    ports:
      - "9501:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "9581:8080"
    depends_on:
      - api
    restart: on-failure
