<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Orbit login — P1 Harbor Navy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500&family=Manrope:wght@600&family=Syne:wght@700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: Manrope, sans-serif; background: #e7e1d6; }
    .stage { width: 1280px; height: 760px; display: flex; background: #f7f9fc; }
    .night {
      width: 520px; background: #0f172a; color: #f7f9fc;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px;
    }
    .night svg { width: 180px; height: 180px; }
    .brand { font-family: Syne, sans-serif; font-weight: 700; letter-spacing: 0.18em; font-size: 34px; margin: 0; }
    .line { font-family: Syne, sans-serif; font-weight: 700; font-size: 22px; margin: 0; }
    .signal { color: #e85d04; }
    .ar { font-family: "IBM Plex Sans Arabic", sans-serif; color: #b7c4d6; font-size: 16px; margin: 8px 0 0; }
    .seam { width: 6px; background: #e85d04; }
    .form { flex: 1; display: flex; align-items: center; padding: 64px 72px; }
    .form inner, .stack { width: 100%; max-width: 420px; }
    h1 { font-family: Syne, sans-serif; font-size: 40px; margin: 0 0 28px; color: #0f172a; }
    label { display: block; font-size: 13px; font-weight: 600; color: #64748b; margin: 0 0 8px; }
    .field { height: 52px; border: 1px solid #d5deea; border-radius: 12px; background: #fff; margin: 0 0 18px; }
    button { width: 100%; height: 54px; border: 0; border-radius: 14px; background: #e85d04; color: #0f172a; font-family: Syne, sans-serif; font-size: 18px; font-weight: 700; }
    .demo { color: #64748b; font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="stage">
    <section class="night">
      <svg viewBox="0 0 256 256" role="img" aria-label="Orbit">
        <path fill="#F7F9FC" d="M 131.59 25.06 A 103 103 0 1 0 222.1 86.11 L 191.03 99.94 A 69 69 0 1 1 130.41 59.04 Z"/>
        <path fill="#F7F9FC" d="M 114 42.05 A 17 17 0 1 0 148 42.05 A 17 17 0 1 0 114 42.05 Z"/>
        <path fill="#F7F9FC" d="M 189.56 93.02 A 17 17 0 1 0 223.56 93.02 A 17 17 0 1 0 189.56 93.02 Z"/>
        <path fill="#E85D04" d="M 167.09 31.7 L 185.09 31.7 A 14 14 0 0 1 199.09 45.7 L 199.09 63.7 A 14 14 0 0 1 185.09 77.7 L 167.09 77.7 A 14 14 0 0 1 153.09 63.7 L 153.09 45.7 A 14 14 0 0 1 167.09 31.7 Z"/>
      </svg>
      <p class="brand">ORBIT</p>
      <p class="line">Maintain every asset.</p>
      <p class="line signal">One orbit.</p>
      <p class="ar">صيانة كل شيء، مكان واحد.</p>
    </section>
    <div class="seam"></div>
    <section class="form">
      <div class="stack">
        <h1>Sign in</h1>
        <label>Email or username</label>
        <div class="field"></div>
        <label>Password</label>
        <div class="field"></div>
        <button type="button">Sign in</button>
        <p class="demo">super@demo.com · admin@demo.com · tech@demo.com</p>
      </div>
    </section>
  </div>
</body>
</html>
