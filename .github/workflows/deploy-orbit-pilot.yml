# Deploy Orbit Pilot (always-on, Supabase Postgres)
#
# Pulls the pilot branch on the pilot VM and rebuilds:
#   docker-compose-pilot-supabase.yml + deploy/pilot/docker-compose.live-supabase.yml
# Cloudflare Tunnel provides HTTPS (currently demo.orbittech.co) — one-time host setup.
#
# Server env: deploy/pilot/.env (from .env.example) with DATABASE_URL + DATABASE_URL_MIGRATE.
#
# Secrets (PILOT_* preferred; legacy DEMO_* still read until renamed in GitHub):
#   PILOT_HOST / DEMO_HOST                   — VM hostname or IP
#   PILOT_USER / DEMO_USER                   — SSH user
#   PILOT_SSH_PRIVATE_KEY / DEMO_SSH_PRIVATE_KEY
# Variables (optional):
#   PILOT_PATH / DEMO_PATH                   — clone path on VM (default /opt/fms)
#   PILOT_URL / DEMO_URL                     — public URL for the post-deploy health check
#
# Branches: pilot/live (canonical). demo/live still deploys until it is retired.
# Cutover and rollback: docs/engineering/ENV_REORG_PLAN.md
# Runbook: docs/guides/pilot-stack.md

name: Deploy Orbit Pilot

on:
  push:
    branches:
      - pilot/live
      - demo/live
  workflow_dispatch:

concurrency:
  group: deploy-orbit-pilot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PILOT_HOST || secrets.DEMO_HOST }}
          username: ${{ secrets.PILOT_USER || secrets.DEMO_USER }}
          key: ${{ secrets.PILOT_SSH_PRIVATE_KEY || secrets.DEMO_SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEPLOY_PATH,DEPLOY_REF
          # Avoid bare `|` in this script: appleboy/drone-ssh mangles pipes into syntax errors.
          script: |
            set -euo pipefail
            DEPLOY_PATH="${DEPLOY_PATH:-/opt/fms}"
            cd "$DEPLOY_PATH"

            git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
            git fetch origin
            BRANCH=pilot/live
            if [ "${DEPLOY_REF:-}" = "demo/live" ]; then
              BRANCH=demo/live
            fi
            echo "Deploying branch $BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git pull --ff-only origin "$BRANCH"

            ENV_FILE=deploy/pilot/.env
            if [ ! -f "$ENV_FILE" ] && [ -f deploy/demo/.env ]; then
              echo "Moving server env file deploy/demo/.env -> $ENV_FILE (one-time cutover)"
              install -m 600 deploy/demo/.env "$ENV_FILE"
            fi
            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE missing — copy deploy/pilot/.env.example and fill Supabase DATABASE_URL(s)"
              exit 1
            fi
            if ! grep -qE '^DATABASE_URL=' "$ENV_FILE"; then
              echo "ERROR: $ENV_FILE must set DATABASE_URL (Supabase). See deploy/pilot/.env.example"
              exit 1
            fi

            # Stop legacy stacks that may hold WEB_PORT / old embedded Postgres.
            set +e
            docker compose -p fms-demo down --remove-orphans
            docker compose -p fms-pilot down --remove-orphans
            set -e

            docker compose -f docker-compose-pilot-supabase.yml -f deploy/pilot/docker-compose.live-supabase.yml --env-file "$ENV_FILE" up -d --build --remove-orphans

            WEB_PORT=8080
            if grep -qE '^WEB_PORT=' "$ENV_FILE"; then
              WEB_PORT=$(grep -E '^WEB_PORT=' "$ENV_FILE")
              WEB_PORT="${WEB_PORT#WEB_PORT=}"
              WEB_PORT="${WEB_PORT%\"}"
              WEB_PORT="${WEB_PORT#\"}"
              WEB_PORT="${WEB_PORT%\'}"
              WEB_PORT="${WEB_PORT#\'}"
            fi
            WEB_PORT="${WEB_PORT:-8080}"

            echo "Waiting for API health via nginx on 127.0.0.1:${WEB_PORT}"
            timeout 180 bash -c "until curl -sf http://127.0.0.1:${WEB_PORT}/api/v1/health; do sleep 5; done"
            echo "Local health check OK"
        env:
          DEPLOY_PATH: ${{ vars.PILOT_PATH || vars.DEMO_PATH || '/opt/fms' }}
          DEPLOY_REF: ${{ github.ref_name }}

      - name: Verify public pilot URL
        if: ${{ vars.PILOT_URL != '' || vars.DEMO_URL != '' }}
        env:
          PUBLIC_URL: ${{ vars.PILOT_URL || vars.DEMO_URL }}
        run: |
          echo "Checking ${PUBLIC_URL}/api/v1/health"
          timeout 60 bash -c 'until curl -fsS "${PUBLIC_URL}/api/v1/health"; do sleep 5; done'
          echo "Public health check OK"
